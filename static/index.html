<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setlister</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<header>
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="3" fill="currentColor"/>
      <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/>
    </svg>
    <span class="logo-text">setlister</span>
  </div>
</header>

<main>
  <div id="error-banner" role="alert"></div>

  <div id="upload-zone" role="button" tabindex="0" aria-label="Upload Excel file">
    <input type="file" id="file-input" accept=".xlsx" />
    <div class="upload-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <p class="upload-title">Drop your Excel file here</p>
    <p class="upload-sub">or click to browse &nbsp;·&nbsp; .xlsx with Artist + Date columns</p>
    <div id="file-name"></div>
  </div>

  <button id="run-btn" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="5 3 19 12 5 21 5 3"/>
    </svg>
    Fetch setlists
  </button>

  <div id="progress-bar-wrap" aria-live="polite">
    <div class="progress-row">
      <span id="progress-label">0 / 0 done</span>
      <span id="progress-pct">0%</span>
    </div>
    <div id="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progress-fill"></div>
    </div>
  </div>

  <div id="toolbar">
    <button id="export-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Export to Excel
    </button>
  </div>

  <div id="results" role="list"></div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
