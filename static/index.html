<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setlist Lookup</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<header>
  <h1>Setlist Lookup</h1>
  <div class="api-key-wrap">
    <label for="api-key">API-nyckel</label>
    <input type="password" id="api-key" placeholder="Din setlist.fm API-nyckel" autocomplete="off" />
  </div>
</header>

<main>
  <div id="error-banner"></div>

  <div id="upload-zone">
    <input type="file" id="file-input" accept=".xlsx" style="display:none" />
    <p><strong>Dra och släpp</strong> en Excel-fil här, eller <strong>klicka</strong> för att välja</p>
    <p>Stöder .xlsx med kolumner Artist + Datum (och valfri Venue)</p>
    <div id="file-name"></div>
  </div>

  <button id="run-btn">Hämta setlister</button>

  <div id="progress-bar-wrap">
    <span id="progress-label">0 / 0 klara</span>
    <div id="progress-track"><div id="progress-fill"></div></div>
  </div>

  <button id="export-btn">⬇ Exportera till Excel</button>

  <div id="results"></div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
