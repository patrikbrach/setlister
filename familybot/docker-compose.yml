version: '3.8'

services:
  briefing:
    build: ./briefing
    env_file: .env
    volumes:
      - ./shared:/app/shared
      - ./google-credentials.json:/app/google-credentials.json:ro
    restart: "no"

  bot:
    build: ./bot
    env_file: .env
    volumes:
      - ./shared:/app/shared
      - ./data:/app/data
      - ./google-credentials.json:/app/google-credentials.json:ro
    restart: unless-stopped
